<title id="t">Kestrel-Nano architecture</title>
<desc id="d">20 unique blocks: 5 entry, 10 core looped R times, 5 exit. Every 4th block is full attention (5 total), the other 15 are gated linear attention. Product-key memory sites on blocks 7 and 14, 16,384 slots each.</desc>
